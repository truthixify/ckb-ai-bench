# Spike (NOT production) tinyproxy config for the no-research arm (ADR-0006).
#
# This models a no-research arm (A/D): chain RPC is allowed, everything else is BLOCKED.
# The allowlist is the Filter file in allowlist-mode (FilterDefaultDeny On): only hosts
# matching an entry are permitted; all other destinations are refused AND logged.

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Log every request (allowed and denied). Logging to stdout (no LogFile) is the
# container-native way to collect this: the platform captures it via `docker logs`,
# with no host-mount permission coupling. This is the machine-observed egress record
# the ADR requires (not agent self-report).
LogLevel Connect

# Allowlist mode: deny by default, permit only Filter matches.
Filter "/conf/allowlist"
FilterDefaultDeny On
# Match against the requested hostname/destination, and treat patterns case-insensitively.
# FilterType ere = POSIX extended regular expressions (tinyproxy 1.11+ replacement for
# the deprecated FilterExtended On).
FilterType ere
FilterCaseSensitive Off

# Allow CONNECT (HTTPS tunneling) only to standard secure ports; the allowlist still
# gates WHICH hosts. Chain RPC in this spike is plain HTTP, but real MCP/TestNet may be TLS.
ConnectPort 443
ConnectPort 8114
ConnectPort 18114
