# Production tinyproxy config for harness egress control (ADR-0006).
#
# FilterDefaultDeny On + per-arm allowlist (built at run time) enforces A/D block mode.
# Observe arms (B/C) mount allowlist.observe (permissive) instead.
# Promoted from spikes/egress-proxy/proxy/tinyproxy.conf.

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Machine-observed egress record (not agent self-report). Stdout is container-native.
LogLevel Connect

Filter "/conf/allowlist"
FilterDefaultDeny On
FilterType ere
FilterCaseSensitive Off

# CONNECT (HTTPS) to standard secure ports; allowlist still gates WHICH hosts.
ConnectPort 443
ConnectPort 8114
ConnectPort 18114