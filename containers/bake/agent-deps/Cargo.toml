# Minimal workspace used only at image-build time to bake contract-side crates
# into image-local CARGO_HOME for offline graded rebuilds. Not shipped into runtime
# workdirs. Must never include hidden suite sources.
[package]
name = "ckbbench-agent-bake"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ckb-std = "=1.1.0"
ckb-testtool = { version = "=1.1.1", optional = true }
ckb-x64-simulator = { version = "=1.1.0", optional = true }
serde_json = { version = "=1.0.151", optional = true }

[features]
template-cache = [
  "ckb-std/native-simulator",
  "dep:ckb-testtool",
  "dep:ckb-x64-simulator",
  "dep:serde_json",
]

[lib]
path = "lib.rs"
