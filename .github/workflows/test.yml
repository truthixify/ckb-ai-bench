name: test

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Bootstrap
        run: |
          PINNED_PYTHON="$(awk '$1=="python"{print $2}' .tool-versions)"
          cd agent
          uv venv --python "$PINNED_PYTHON" .venv
          uv pip install -r spike-requirements.txt
          uv pip install -e "..[dev]"

      - name: Run tests
        run: scripts/test.sh

      - name: Validate container boundary
        run: bash containers/validate.sh
