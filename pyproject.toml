[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckbbench"
description = "CKB AI Bench: a versioned benchmark harness measuring the CKB AI MCP server's marginal value to an AI coding agent."
requires-python = ">=3.12"
dynamic = ["version"]
# Runtime deps are intentionally minimal: the harness leans on stdlib + the agent fork's
# pinned deps (agent/spike-requirements.txt). requests serves the MCP client; httpx is the
# provider-probe transport, chosen because production LiteLLM speaks over the same stack.
# litellm etc. still come transitively from the agent fork at run time. Both are pinned exact
# for cross-run reproducibility: LiteLLM only constrains httpx>=0.23.0, so a fresh environment
# could otherwise select different transport behavior without any reviewed byte changing.
dependencies = [
    "requests==2.34.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Dev/test only, and the SINGLE source for these pins. Install into the agent venv via:
#   cd agent && uv pip install --python .venv/bin/python -e "..[dev]"
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "ckbbench._pkg_version.__version__" }

[tool.setuptools.packages.find]
include = ["ckbbench*"]

[tool.pytest.ini_options]
# Test roots for the whole harness: the ckbbench package, the container helper scripts
# (containers/*.py carry real per-arm allowlist logic that must be unit-tested), and scripts/
# (the operator CLI's run lock is driven through real processes). Node/Rust verifier tests run
# via their own runners (scripts/test.sh ties them together).
testpaths = ["ckbbench", "containers", "scripts"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ckbbench", "containers"]
omit = ["ckbbench/**/test_*.py", "ckbbench/**/*_test.py", "containers/test_*.py"]

[tool.coverage.report]
# Keep the default pragma, and also exclude the CLI-entry guard (main() is tested directly).
exclude_lines = ['pragma: no cover', 'if __name__ == .__main__.:']
